[package]
name = "glyph-backend"
version = "0.1.0"
edition = "2024"

[lib]
name = "glyph_backend"
path = "src/lib.rs"

[[bin]]
name = "glyph"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
async-trait = "0.1.92"
axum = { version = "0.8.9", features = ["http2"] }
chrono = { version = "0.4.45", features = ["serde"] }
dotenvy = "0.15.7"
prost = "0.14.4"
prost-types = "0.14.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sqlx = { version = "0.9.0", default-features = false, features = ["postgres", "runtime-tokio", "tls-rustls", "uuid", "chrono", "json", "migrate", "macros"] }
thiserror = "2.0.21"
tokio = { version = "1.53.1", features = ["full"] }
tonic = "0.14.6"
tonic-health = "0.14.6"
tonic-prost = "0.14.6"
tonic-reflection = "0.14.6"
tonic-types = "0.14.6"
tonic-web = "0.14.6"
tower = "0.5.3"
tower-http = { version = "0.7.1", features = ["cors", "trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
uuid = { version = "1.26.1", features = ["v4", "serde"] }

[build-dependencies]
protox = "0.9.1"
tonic-prost-build = "0.14.6"

[dev-dependencies]
http-body-util = "0.1.5"
tower = { version = "0.5.3", features = ["util"] }
