[package]
name = "glyph-backend"
version = "0.1.0"
edition = "2024"

[lib]
name = "glyph_backend"
path = "src/lib.rs"

[[bin]]
name = "glyph"
path = "src/main.rs"

[dependencies]
aes-gcm = "0.11.1"
anyhow = "1.0.104"
async-trait = "0.1.92"
axum = { version = "0.8.9", features = ["http2"] }
base64 = "0.23.1"
chrono = { version = "0.4.45", features = ["serde"] }
chrono-tz = "0.10.4"
croner = "4.0.0"
dotenvy = "0.15.7"
getrandom = "0.4.3"
hex = "0.4.3"
jsonschema = "0.58.1"
nix = { version = "0.31.3", features = ["signal"] }
prost = "0.14.4"
prost-types = "0.14.4"
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
saphyr-parser = "0.1.0"
secrecy = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["preserve_order"] }
sha2 = "0.11.0"
sqlx = { version = "0.9.0", default-features = false, features = ["postgres", "runtime-tokio", "tls-rustls", "uuid", "chrono", "json", "migrate", "macros"] }
tempfile = "3.27.0"
thiserror = "2.0.21"
tokio = { version = "1.53.1", features = ["full"] }
tokio-util = { version = "0.7.19", features = ["rt"] }
tonic = "0.14.6"
tonic-health = "0.14.6"
tonic-prost = "0.14.6"
tonic-reflection = "0.14.6"
tonic-types = "0.14.6"
tonic-web = "0.14.6"
tower = "0.5.3"
tower-http = { version = "0.7.1", features = ["cors", "trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
uuid = { version = "1.26.1", features = ["v4", "serde"] }
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }

[build-dependencies]
prost = "0.14.4"
protox = "0.9.1"
tonic-prost-build = "0.14.6"

[dev-dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
chrono = "0.4.45"
http-body-util = "0.1.5"
prost = "0.14.4"
prost-types = "0.14.4"
secrecy = "0.10.3"
tempfile = "3.27.0"
tokio-util = "0.7.19"
tower = { version = "0.5.3", features = ["util"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
uuid = "1.26.1"
wiremock = "0.6.5"

[dev-dependencies.tokio]
version = "1.53.1"
features = ["full", "test-util"]
