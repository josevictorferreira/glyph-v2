# cargo deny check — licenses, advisories, bans, sources.
[graph]
all-features = false

[advisories]
version = 2
yanked = "deny"
ignore = [
    # chrono/chrono-tz are unmaintained (RUSTSEC-2026-0543/0555) with no safe
    # upgrade; migrating to jiff is its own project. Tracked for follow-up.
    "RUSTSEC-2026-0543",
    "RUSTSEC-2026-0555",
]

[licenses]
version = 2
confidence-threshold = 0.8
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CDLA-Permissive-2.0",
    "BSL-1.0",
]

[licenses.private]
ignore = true

[bans]
multiple-versions = "allow"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
